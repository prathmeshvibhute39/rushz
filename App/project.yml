name: Rushz
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  YouTubeKit:
    path: Packages/YouTubeKit  # our own vendored copy (MIT), see Packages/YouTubeKit/VENDORED.md
targets:
  Rushz:
    type: application
    platform: iOS
    scheme:
      testTargets: [RushzTests]
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    dependencies:
      - package: YouTubeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rushz
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rushz
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""  # set to your Apple team ID (Xcode > Settings > Accounts), see README
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RushzTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Rushz
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rushz.tests
        SWIFT_VERSION: "5.0"
